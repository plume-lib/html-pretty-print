name: Java CI with Gradle

"on": [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25', '27-ea']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: 'gradle'
      - name: java -version
        run: java -version
      - name: Warm up Gradle cache
        run: >-
          ./gradlew --quiet spotlessCheck
          || (sleep 60 && ./gradlew --quiet --refresh-dependencies spotlessCheck)
          || true
      - name: ./gradlew build
        run: ./gradlew build

name: Java CI with Gradle

"on": [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25', '27-ea']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: 'gradle'
      - name: java -version
        run: java -version
      - name: Clone plume-scripts
        run: git clone --depth 1 -q https://github.com/plume-lib/plume-scripts.git "${{ runner.temp }}/plume-scripts"
      - name: ./gradlew build
        run: ${{ runner.temp }}/plume-scripts/gradlew-retry build
